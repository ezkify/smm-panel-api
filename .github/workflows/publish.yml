name: publish-sdks

# Publish all SDKs to npm / PyPI / Packagist when a release is cut,
# or on-demand via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  notify-packagist:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.PACKAGIST_API_TOKEN }}" \
            -d '{"repository":{"url":"https://repo.packagist.org/p2/ezkify/smm-panel-api.json","display_name":"ezkify/smm-panel-api"}}' \
            https://packagist.org/api/packages -o /dev/null